openapi: 3.2.0
info:
  title: Vectorize Destination Connectors API
  description: 'The Vectorize API lets developers programmatically build and operate RAG (retrieval-augmented generation) pipelines: create / start / stop / delete pipelines, run retrieval against a pipeline''s vector index, manage source, destination, and AI-platform connectors, upload files, extract documents with Iris, and run deep research. All paths are organization-scoped under /org/{organizationId}. Authentication uses a Bearer access token.'
  termsOfService: https://vectorize.io/terms
  contact:
    name: Vectorize Support
    url: https://vectorize.io
  version: 0.1.2
servers:
- url: https://api.vectorize.io/v1
  description: Vectorize API
security:
- bearerAuth: []
tags:
- name: Destination Connectors
  description: Manage destination (vector database) connectors.
paths:
  /org/{organizationId}/connectors/destinations:
    post:
      operationId: createDestinationConnector
      tags:
      - Destination Connectors
      summary: Create a destination connector
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Destination connector created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorResponse'
    get:
      operationId: getDestinationConnectors
      tags:
      - Destination Connectors
      summary: List destination connectors
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      responses:
        '200':
          description: Destination connectors.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
  /org/{organizationId}/connectors/destinations/{destinationConnectorId}:
    get:
      operationId: getDestinationConnector
      tags:
      - Destination Connectors
      summary: Retrieve a destination connector
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/DestinationConnectorId'
      responses:
        '200':
          description: Destination connector.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConnectorResponse'
        '404':
          $ref: '#/components/responses/Error'
    patch:
      operationId: updateDestinationConnector
      tags:
      - Destination Connectors
      summary: Update a destination connector
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/DestinationConnectorId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: true
      responses:
        '200':
          description: Destination connector updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
    delete:
      operationId: deleteDestinationConnector
      tags:
      - Destination Connectors
      summary: Delete a destination connector
      parameters:
      - $ref: '#/components/parameters/OrganizationId'
      - $ref: '#/components/parameters/DestinationConnectorId'
      responses:
        '200':
          description: Destination connector deleted.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
components:
  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string
      required:
      - message
    ConnectorResponse:
      type: object
      properties:
        message:
          type: string
        connectorId:
          type: string
      additionalProperties: true
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
        details:
          type: string
        failedUpdates:
          type: array
          items:
            type: string
        successfulUpdates:
          type: array
          items:
            type: string
      required:
      - error
  responses:
    Error:
      description: Error response.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  parameters:
    DestinationConnectorId:
      name: destinationConnectorId
      in: path
      required: true
      schema:
        type: string
    OrganizationId:
      name: organizationId
      in: path
      required: true
      description: Vectorize organization identifier.
      schema:
        type: string
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Vectorize API access token passed as a Bearer token.
